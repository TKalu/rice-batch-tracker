<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batch Transparency Portal</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --accent: #c89b2b;
  --soft-beige: #F5F3EE;
  --muted-grey: #6C757D;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--soft-beige);
  color: #222;
  line-height: 1.6;
}

/* HERO */

.hero {
  height: 48vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  background-size: cover;
  background-position: center;
  padding: 20px;
}

.hero-content h1 {
  font-size: 3rem;
  font-weight: 700;
  margin-bottom: 10px;
}

.hero-content p {
  font-size: 1.1rem;
  font-weight: 300;
}

/* BATCH CONTAINER */

.batch-container {
  max-width: 1100px;
  margin: auto;
  padding: 70px 20px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* BATCH CARD */

.batch-card {
  background: white;
  border-radius: 24px;
  padding: 50px 35px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  transition: all 0.4s ease;
}

.batch-card.featured {
  opacity: 1;
  transform: scale(1);
}

.batch-card.secondary {
  opacity: 0.72;
  transform: scale(0.98);
}

.batch-card.archive {
  opacity: 0.55;
}

/* HEADER */

.batch-header {
  margin-bottom: 45px;
}

.batch-label {
  font-size: 0.72rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted-grey);
  margin-bottom: 8px;
}

.batch-title {
  font-size: 1.9rem;
  font-weight: 600;
}

/* TIMELINE */

.timeline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  margin-top: 10px;
}

.timeline::before {
  content: "";
  position: absolute;
  top: 35px;
  left: 8%;
  right: 8%;
  height: 3px;
  background: rgba(0,0,0,0.08);
  border-radius: 10px;
  z-index: 0;
}

.stage {
  text-align: center;
  position: relative;
  z-index: 1;
  width: 25%;
}

.stage-icon {
  width: 110px;
  height: 110px;
  margin: auto;
  border-radius: 50%;
  background: white;
  border: 3px solid #d9d9d9;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  transition: all 0.35s ease;
}

.timeline-icon {
  width: 85px;
  height: 85px;
  object-fit: contain;
  display: block;
}

/* COMPLETED */

.stage.completed .stage-icon {
  background: var(--accent);
  border-color: var(--accent);
}

.stage.completed .timeline-icon {
  filter: brightness(0) invert(1);
}

/* ACTIVE */

.stage.active .stage-icon {
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(230,180,44,0.25);
  transform: scale(1.05);
}

/* UPCOMING */

.stage.upcoming .stage-icon {
  opacity: 0.4;
}

.stage h4 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 5px;
}

.stage p {
  font-size: 0.88rem;
  color: var(--muted-grey);
}

/* RESERVATION */

.reservation-card {
  margin-top: 50px;
  padding-top: 10px;
}

.reservation-title {
  font-size: 1rem;
  margin-bottom: 18px;
  font-weight: 600;
}

.progress-bar {
  width: 100%;
  height: 12px;
  background: #ececec;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 14px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 1s ease;
}

.reservation-text {
  font-size: 0.92rem;
  color: var(--muted-grey);
}

/* FOOTER */

footer {
  text-align: center;
  padding: 35px;
  margin-top: 40px;
  background: var(--accent);
  color: white;
  font-size: 0.9rem;
}

/* FADE */

.fade-in {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}

.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}

/* MOBILE */

@media(max-width: 768px) {

  .hero-content h1 {
    font-size: 2.2rem;
  }

  .batch-card {
    padding: 35px 20px;
  }

  .timeline {
    gap: 10px;
  }

  .stage-icon {
    width: 58px;
    height: 58px;
  }

  .timeline-icon {
    width: 38px;
    height: 38px;
  }

  .stage h4 {
    font-size: 0.82rem;
  }

  .stage p {
    font-size: 0.7rem;
  }

  .timeline::before {
    top: 28px;
  }

  .batch-title {
    font-size: 1.4rem;
  }

}

</style>
</head>

<body>

<!-- HERO -->

<div class="hero">
  <div class="hero-content">
    <h1 id="heroTitle">Naturally Aged Rice</h1>
    <p id="heroSubtitle">Harvest Season</p>
  </div>
</div>

<!-- BATCHES -->

<div id="batchContainer" class="batch-container fade-in"></div>

<!-- FOOTER -->

<footer>
  Transparent. Limited. Chemical-Free.
</footer>

<script>

fetch("data.json?v=" + new Date().getTime())
.then(response => response.json())
.then(data => {

  /* HERO */

  document.querySelector(".hero").style.backgroundImage =
    `linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.10)), url('${data.hero.backgroundImage}')`;

  document.getElementById("heroTitle").textContent =
    data.hero.title;

  document.getElementById("heroSubtitle").textContent =
    data.hero.subtitle;

  /* BATCH RENDERING */

  const container = document.getElementById("batchContainer");

  const stages = ["aging", "milling", "packaging", "delivery"];

  data.batches.forEach(batch => {

    let cardClass = "secondary";
    let label = "Future Batch";

    if (batch.type === "current") {
      cardClass = "featured";
      label = "Current Batch";
    }

    if (batch.type === "archive") {
      cardClass = "archive";
      label = "Completed Batch";
    }

    const currentIndex = stages.indexOf(batch.stage);

    const stageHTML = stages.map((stage, index) => {

      let stateClass = "upcoming";

      if (batch.status === "completed") {
        stateClass = "completed";
      }
      else if (index < currentIndex) {
        stateClass = "completed";
      }
      else if (index === currentIndex) {
        stateClass = "active";
      }

      const iconMap = {
        aging: "aging.png",
        milling: "milling.png",
        packaging: "packaging.png",
        delivery: "delivery.png"
      };

      return `
        <div class="stage ${stateClass}">
          <div class="stage-icon">
            <img
              src="assets/icons/${iconMap[stage]}"
              alt="${stage}"
              class="timeline-icon"
            >
          </div>

          <h4>${stage.charAt(0).toUpperCase() + stage.slice(1)}</h4>

          <p>${batch.stageDates[stage] || ""}</p>
        </div>
      `;

    }).join("");

    /* RESERVATION */

    let reservationHTML = "";

    if (batch.stock) {

      const total = batch.stock.totalKg;
      const reserved = batch.stock.reservedKg;
      const remaining = total - reserved;
      const percent = (reserved / total) * 100;

      reservationHTML = `
        <div class="reservation-card">

          <div class="reservation-title">
            Batch Reservation
          </div>

          <div class="progress-bar">
            <div
              class="progress-fill"
              style="width:${percent}%">
            </div>
          </div>

          <p class="reservation-text">
            Reserved: ${reserved} kg
            &nbsp;|&nbsp;
            Remaining: ${remaining} kg
            &nbsp;|&nbsp;
            Total: ${total} kg
          </p>

        </div>
      `;
    }

    /* CARD */

    const card = document.createElement("div");

    card.className = `batch-card ${cardClass}`;

    card.innerHTML = `

      <div class="batch-header">

        <div class="batch-label">
          ${label}
        </div>

        <div class="batch-title">
          ${batch.batchId}
        </div>

      </div>

      <div class="timeline">
        ${stageHTML}
      </div>

      ${reservationHTML}

    `;

    container.appendChild(card);

  });

  /* ANIMATION */

  setTimeout(() => {
    document.querySelector(".fade-in").classList.add("visible");
  }, 100);

})
.catch(error => console.error("Error loading data:", error));

</script>

</body>
</html>
