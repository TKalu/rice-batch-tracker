<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batch Transparency Portal</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --deep-green: #e6b42c;
  --soft-beige: #F5F3EE;
  --muted-grey: #6C757D;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--soft-beige);
  color: #222;
  line-height: 1.6;
}

/* HERO */

.hero {
  height: 48vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  background-size: cover;
  background-position: center;
  padding: 20px;
}

.hero-content h1 {
  font-size: 3rem;
  font-weight: 700;
  margin-bottom: 10px;
}

.hero-content p {
  font-size: 1.1rem;
  font-weight: 300;
}

/* SECTION */

.section {
  padding: 60px 20px;
  max-width: 1100px;
  margin: auto;
}

.section-title {
  text-align: center;
  margin-bottom: 10px;
  font-size: 2rem;
}

/* TIMELINE */

.timeline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 50px;
  position: relative;
}

.timeline::before {
  content: "";
  position: absolute;
  top: 35px;
  left: 8%;
  right: 8%;
  height: 4px;
  background: #d9d9d9;
  border-radius: 10px;
  z-index: 0;
}

.stage {
  text-align: center;
  position: relative;
  z-index: 1;
  width: 25%;
}

.stage-icon {
  width: 110px;
  height: 110px;
  margin: auto;
  border-radius: 50%;
  background: white;
  border: 3px solid #d9d9d9;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  transition: all 0.3s ease;
  font-size: 1.2rem;
}

.timeline-icon {
  width: 85px;
  height: 85px;
  object-fit: contain;
  display: block;
}

/* COMPLETED */

.stage.completed .stage-icon {
  background: var(--deep-green);
  border-color: var(--deep-green);
  color: white;
}

/* ACTIVE */

.stage.active .stage-icon {
  border-color: var(--deep-green);
  box-shadow: 0 0 18px rgba(27, 67, 50, 0.35);
  transform: scale(1.05);
}

/* UPCOMING */

.stage.upcoming .stage-icon {
  opacity: 0.45;
}

.stage h4 {
  font-weight: 600;
  margin-bottom: 4px;
}

.stage p {
  font-size: 0.9rem;
  color: var(--muted-grey);
}

/* RESERVATION CARD */

.reservation-card {
  background: white;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  margin-top: 50px;
}

.reservation-card h3 {
  margin-bottom: 15px;
  font-size: 1.2rem;
}

.progress-bar {
  width: 100%;
  height: 14px;
  background: #ececec;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 15px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--deep-green);
  transition: width 1s ease;
}

.reservation-text {
  color: var(--muted-grey);
  font-size: 0.95rem;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 30px;
  background: var(--deep-green);
  color: white;
  margin-top: 60px;
  font-size: 0.9rem;
}

/* FADE IN */

.fade-in {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}

.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}

/* MOBILE */

@media(max-width: 768px) {

  .hero-content h1 {
    font-size: 2.2rem;
  }

  .timeline {
    gap: 10px;
  }

  .stage-icon {
    width: 58px;
    height: 58px;
    font-size: 1rem;
  }

  .timeline-icon {
    width: 40px;
    height: 40px;
  }

  .stage h4 {
    font-size: 0.9rem;
  }

  .stage p {
    font-size: 0.75rem;
  }
}

</style>
</head>

<body>

<div class="hero">
  <div class="hero-content">
    <h1 id="batchId">Batch ID</h1>
    <p id="harvestSeason"></p>
  </div>
</div>

<div class="section fade-in">

  <h2 class="section-title">Batch: H1-B1</h2>

  <div class="timeline">

    <div class="stage" id="aging">
      <div class="stage-icon">
        <img src="assets/icons/aging.png" alt="Aging stage" class="timeline-icon">
      </div>
      <h4>Aging</h4>
      <p id="agingDate"></p>
    </div>

    <div class="stage" id="milling">
      <div class="stage-icon">
        <img src="assets/icons/milling.png" alt="Milling stage" class="timeline-icon">
      </div>
      <h4>Milling</h4>
      <p id="millingDate"></p>
    </div>

    <div class="stage" id="packaging">
      <div class="stage-icon">
        <img src="assets/icons/packaging.png" alt="Packaging stage" class="timeline-icon">
      </div>
      <h4>Packaging</h4>
      <p id="packagingDate"></p>
    </div>

    <div class="stage" id="delivery">
      <div class="stage-icon">
        <img src="assets/icons/delivery.png" alt="Delivery stage" class="timeline-icon">
      </div>
      <h4>Delivery</h4>
      <p id="deliveryDate"></p>
    </div>

  </div>

  <div class="reservation-card">

    <h3>Batch Reservation</h3>

    <div class="progress-bar">
      <div class="progress-fill" id="reservationBar"></div>
    </div>

    <p class="reservation-text" id="reservationText"></p>

  </div>

</div>

<footer>
  Transparent. Limited. Chemical-Free.
</footer>

<script>

fetch("data.json?v=" + new Date().getTime())
.then(response => response.json())
.then(data => {

  const validStages = ["aging", "milling", "packaging", "delivery"];

  if (!validStages.includes(data.stage)) {
    console.warn("Invalid stage detected.");
    data.stage = "aging";
  }

  /* HERO IMAGE */

  document.querySelector(".hero").style.backgroundImage =
    `linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.10)), url('${data.backgroundImage}')`;

  /* HERO TEXT */

  document.getElementById("batchId").textContent = data.batchId;

  document.getElementById("harvestSeason").textContent =
    "Harvest Season: " + data.harvestSeason;

  /* STAGE DATES */

  document.getElementById("agingDate").textContent =
    data.stageDates.aging || "";

  document.getElementById("millingDate").textContent =
    data.stageDates.milling || "";

  document.getElementById("packagingDate").textContent =
    data.stageDates.packaging || "";

  document.getElementById("deliveryDate").textContent =
    data.stageDates.delivery || "";

  /* TIMELINE STATES */

  const stages = ["aging", "milling", "packaging", "delivery"];
  const currentIndex = stages.indexOf(data.stage);

  stages.forEach((stage, index) => {

    const element = document.getElementById(stage);

    if (data.status === "completed") {
      element.classList.add("completed");
    }
    else if (index < currentIndex) {
      element.classList.add("completed");
    }
    else if (index === currentIndex) {
      element.classList.add("active");
    }
    else {
      element.classList.add("upcoming");
    }
  });

  /* RESERVATION */

  const total = data.stock.totalKg;
  const reserved = data.stock.reservedKg;
  const remaining = total - reserved;

  const percent = (reserved / total) * 100;

  document.getElementById("reservationBar").style.width =
    percent + "%";

  document.getElementById("reservationText").textContent =
    `Reserved: ${reserved} kg | Remaining: ${remaining} kg | Total: ${total} kg`;

  /* ANIMATION */

  document.querySelector(".fade-in").classList.add("visible");

})
.catch(error => console.error("Error loading data:", error));

</script>

</body>
</html>
